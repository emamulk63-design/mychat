<!DOCTYPE html>
<html>
<head>
    <title>Edit Profile</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        body{
            font-family:Arial,sans-serif;
            background:#f5f5f5;
            padding:20px;
        }

        .card{
            background:#fff;
            border-radius:15px;
            padding:20px;
            max-width:450px;
            margin:auto;
            box-shadow:0 0 10px rgba(0,0,0,.1);
        }

        h2{
            text-align:center;
        }

        input,textarea{
            width:100%;
            padding:10px;
            margin-top:10px;
            margin-bottom:15px;
            border:1px solid #ccc;
            border-radius:8px;
        }

        button{
            width:100%;
            padding:12px;
            border:none;
            background:#0084ff;
            color:white;
            border-radius:8px;
            font-size:16px;
        }
    </style>

</head>

<body>

<div class="card">

<h2>👤 Edit Profile</h2>

<form method="POST" enctype="multipart/form-data">

{% csrf_token %}

{{ form.as_p }}

<button type="submit">
Save Profile
</button>

</form>

</div>

</body>
</html>
