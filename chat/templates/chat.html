<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>চ্যাট - {{ receiver.username }}</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 500px;
            margin: auto;
            background: #f0f4ff;
        }
        .chat-box {
            height: 400px;
            overflow-y: scroll;
            border: 1px solid #ccc;
            padding: 10px;
            background: white;
            border-radius: 10px;
        }
        .msg {
            margin: 10px 0;
            padding: 10px;
            border-radius: 10px;
            max-width: 80%;
        }
        .sent {
            background: #007bff;
            color: white;
            margin-left: auto;
            text-align: right;
        }
        .received {
            background: #e9ecef;
            color: black;
        }
        .message-container {
            display: flex;
            flex-direction: column;
        }
        form {
            display: flex;
            margin-top: 10px;
            gap: 10px;
        }
        input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }
        button {
            padding: 10px 20px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
        }
        a {
            color: red;
            text-decoration: none;
        }
        .timestamp {
            display: block;
            font-size: 10px;
            opacity: 0.7;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <h2>💬 চ্যাট: {{ receiver.username }}</h2>
    <a href="{% url 'home' %}">← হোমে ফিরে যান</a>
    
    <div class="chat-box" id="chat-box">
        {% for message in messages %}
            <div class="message-container">
                <div class="msg {% if message.sender == request.user %}sent{% else %}received{% endif %}">
                    {{ message.text }}
                    <span class="timestamp">
                        {{ message.timestamp }}
                    </span>
                </div>
            </div>
        {% empty %}
            <p style="text-align: center; color: gray;">কোনো মেসেজ নেই। প্রথম মেসেজ পাঠান!</p>
        {% endfor %}
    </div>
    
    <form method="POST">
        {% csrf_token %}
        <input type="text" name="text" placeholder="মেসেজ লিখুন..." required>
        <button type="submit">পাঠান</button>
    </form>
    
    <script>
        // অটো স্ক্রল নিচে
        const chatBox = document.getElementById('chat-box');
        chatBox.scrollTop = chatBox.scrollHeight;
    </script>
</body>
</html>
